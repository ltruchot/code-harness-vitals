[alias]
dummy = "run --quiet --locked -p dummy --"
xtask = "run --quiet --locked -p xtask --"

# Dependency cooldown: never resolve a crate version published less than 3 days ago (ADR 3).
# One-off override for an urgent fix: CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow
[registry]
global-min-publish-age = "3 days"
