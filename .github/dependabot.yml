version: 2
updates:
  # Cooldown: a release must be at least 3 days old before Dependabot proposes it (ADR 3).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
